name: Pending Resources Alert

on:
  schedule:
    # Every weekday + Saturday at 1:30 PM IST (8:00 AM UTC)
    - cron: "0 8 * * 1-6"
  workflow_dispatch:
    inputs:
      target_user_id:
        description: "Only check this user (leave blank for all)"
        required: false
        default: ""

jobs:
  pending-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run compliance check (sync latest data)
        run: npm run compliance
        env:
          TARGET_USER_ID: ${{ inputs.target_user_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LO_SLACK_WEBHOOK_URL: ${{ secrets.LO_SLACK_WEBHOOK_URL }}
          APP_TIMEZONE: ${{ secrets.APP_TIMEZONE || 'Asia/Kolkata' }}
          LMS_DB_HOST: ${{ secrets.LMS_DB_HOST }}
          LMS_DB_USER: ${{ secrets.LMS_DB_USER }}
          LMS_DB_PASSWORD: ${{ secrets.LMS_DB_PASSWORD }}
          LMS_DB_NAME: ${{ secrets.LMS_DB_NAME || 'prod_course' }}
          LMS_PASSWORD_ENCRYPTION_KEY: ${{ secrets.LMS_PASSWORD_ENCRYPTION_KEY }}

      - name: Send high-alert pending reminder to Slack
        run: |
          STATUS=$(curl -s -o /tmp/slack_response.txt -w "%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/slack/resources-reminder/230pm?force=1" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/slack_response.txt
          if [ "$STATUS" != "200" ]; then
            echo "Slack notification failed with status $STATUS"
            exit 1
          fi
