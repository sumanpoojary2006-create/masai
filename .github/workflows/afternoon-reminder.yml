name: 2:30 PM Afternoon Reminder

on:
  schedule:
    - cron: '0 9 * * 1-6' # 2:30 PM IST (Mon–Sat)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send 2:30 PM reminder
        run: |
          STATUS=$(curl -s -o /tmp/slack_response.txt -w "%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/slack/resources-reminder/230pm" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/slack_response.txt
          if [ "$STATUS" != "200" ]; then
            echo "Request failed with status $STATUS"
            exit 1
          fi
