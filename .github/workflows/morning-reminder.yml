name: 11 AM Morning Reminder

on:
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send 11 AM reminder
        run: |
          STATUS=$(curl -s -o /tmp/slack_response.txt -w "%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/slack/resources-reminder/11am?force=1" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/slack_response.txt
          if [ "$STATUS" != "200" ]; then
            echo "Request failed with status $STATUS"
            exit 1
          fi
