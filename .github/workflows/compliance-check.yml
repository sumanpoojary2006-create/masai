name: Compliance Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      target_user_id:
        description: "Only check this user (leave blank for all users — scheduled runs always check all)"
        required: false
        default: ""

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run compliance automation
        run: npm run compliance
        env:
          TARGET_USER_ID: ${{ inputs.target_user_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LO_SLACK_WEBHOOK_URL: ${{ secrets.LO_SLACK_WEBHOOK_URL }}
          APP_TIMEZONE: ${{ secrets.APP_TIMEZONE || 'Asia/Kolkata' }}
          LMS_DB_HOST: ${{ secrets.LMS_DB_HOST }}
          LMS_DB_USER: ${{ secrets.LMS_DB_USER }}
          LMS_DB_PASSWORD: ${{ secrets.LMS_DB_PASSWORD }}
          LMS_DB_NAME: ${{ secrets.LMS_DB_NAME || 'prod_course' }}

