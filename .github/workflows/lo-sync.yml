name: LO Sync

on:
  schedule:
    # Every day at 11:00 PM IST (17:30 UTC)
    - cron: "30 17 * * *"
    # Every day at 12:00 AM IST (18:30 UTC)
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      target_user_id:
        description: "Only sync/analyze this user (leave blank to sync all users)"
        required: false
        default: ""

jobs:
  lo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run LO sync
        run: npx tsx scripts/run-lo-sync.ts
        env:
          TARGET_USER_ID: ${{ inputs.target_user_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LO_SLACK_WEBHOOK_URL: ${{ secrets.LO_SLACK_WEBHOOK_URL }}
          APP_TIMEZONE: ${{ secrets.APP_TIMEZONE || 'Asia/Kolkata' }}
          LMS_PASSWORD_ENCRYPTION_KEY: ${{ secrets.LMS_PASSWORD_ENCRYPTION_KEY }}
          LMS_DB_HOST: ${{ secrets.LMS_DB_HOST }}
          LMS_DB_USER: ${{ secrets.LMS_DB_USER }}
          LMS_DB_PASSWORD: ${{ secrets.LMS_DB_PASSWORD }}
          LMS_DB_NAME: ${{ secrets.LMS_DB_NAME || 'prod_course' }}
